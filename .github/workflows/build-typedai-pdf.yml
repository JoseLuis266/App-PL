name: Build TypedAI temario PDF

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_typedai_pdf.py'
      - 'scripts/prepare_marco_typedai.py'
      - 'scripts/enrich_vehicle_annexes.py'
      - 'export/**'
      - '.github/workflows/build-typedai-pdf.yml'
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'issues' || contains(github.event.issue.title, '[BUILD TYPEDAI PDF]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: pip install reportlab beautifulsoup4
      - name: Prepare exact Decreto 40/2019 range for T20 and tighten T17
        run: python scripts/prepare_marco_typedai.py
      - name: Complete vehicle Annex II and Annex XVIII I-II from official BOE
        run: python scripts/enrich_vehicle_annexes.py
      - name: Build PDF and TXT
        run: python scripts/build_typedai_pdf.py
      - name: Show output
        run: ls -lh typedai_output && cat typedai_output/COBERTURA_TYPEDAI.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: temario-pl-baleares-2026-typedai
          path: typedai_output/
          if-no-files-found: error
          retention-days: 30
